name: Telegram morning report delivery

on:
  push:
    branches: [main]
    paths:
      - 'reports/morning-report.md'
      - 'reports/youtube-script-*.md'
      - 'reports/youtube-script-*.txt'
      - '.github/workflows/telegram-morning-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout report
        uses: actions/checkout@v4

      - name: Generate handwritten paper slip images
        run: |
          python -m pip install --quiet Pillow
          FONT_PATH=/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf
          if curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/caveat/Caveat%5Bwght%5D.ttf' -o /tmp/Caveat.ttf; then
            FONT_PATH=/tmp/Caveat.ttf
          fi
          export FONT_PATH
          python - <<'PY'
          from pathlib import Path
          import os, re, textwrap
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          report = Path("reports/morning-report.md").read_text(encoding="utf-8")
          W, H = 1080, 1350
          PW, PH = 980, 1250
          font_path = os.environ.get("FONT_PATH", "/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf")
          def font(size, fallback=None):
              try:
                  return ImageFont.truetype(font_path, size)
              except Exception:
                  return ImageFont.truetype(fallback or "/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf", size)
          title_font = font(92)
          label_font = font(48)
          leg_font = font(59)
          odds_font = font(88)
          tiny_font = font(38)
          slips = {}
          for sec in re.split(r"(?=SLIP [1-3] —)", report):
              m = re.match(r"SLIP ([1-3]) — (.+)", sec)
              if not m:
                  continue
              num, label = m.groups()
              odds = re.search(r"combined odds\s+([0-9.]+)", sec, re.I)
              legs = re.findall(r"^•\s*(.+)$", sec, re.M)
              if not legs:
                  raise SystemExit(f"No selections found for Slip {num}")
              if not odds:
                  raise SystemExit(f"Combined odds missing for Slip {num}")
              slips[num] = (label.strip(), odds.group(1), legs)
          if len(slips) != 3:
              raise SystemExit(f"Expected 3 slips but parsed {len(slips)}")
          for n in "123":
              label, combined, legs = slips[n]
              canvas = Image.new("RGB", (W, H), "#CDBB9E")
              # soft paper shadow
              shadow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              sd = ImageDraw.Draw(shadow)
              sd.rectangle((43, 42, 1035, 1308), fill=(44, 34, 22, 85))
              shadow = shadow.filter(ImageFilter.GaussianBlur(22))
              canvas.paste(shadow, (0, 0), shadow)
              paper = Image.new("RGB", (PW, PH), "#F6F0E2")
              noise = Image.effect_noise((PW, PH), 10).convert("RGB")
              paper = Image.blend(paper, noise, 0.035)
              canvas.paste(paper, (50, 42))
              d = ImageDraw.Draw(canvas)
              # paper edge and notebook ruling
              d.rectangle((50, 42, 1030, 1292), outline="#E5DAC5", width=3)
              for yy in range(330, 1175, 74):
                  d.line((95, yy, 1000, yy), fill="#D8E1E8", width=2)
              d.line((160, 90, 160, 1225), fill="#D99B91", width=3)
              d.text((205, 92), "Mr2Odds  •  match notes", font=label_font, fill="#52677A")
              d.text((205, 165), f"SLIP {n}", font=title_font, fill="#203C57")
              d.text((210, 258), label, font=label_font, fill="#39536B")
              # hand-drawn divider
              d.line((205, 315, 955, 311), fill="#39536B", width=4)
              y = 355
              for i, leg in enumerate(legs, 1):
                  words = leg.split()
                  lines, line = [], ""
                  for word in words:
                      candidate = (line + " " + word).strip()
                      if d.textbbox((0, 0), candidate, font=leg_font)[2] > 780 and line:
                          lines.append(line)
                          line = word
                      else:
                          line = candidate
                  if line:
                      lines.append(line)
                  if len(lines) > 2:
                      raise SystemExit(f"Slip {n}, leg {i} is too long for a readable handwritten layout")
                  # ink check mark
                  d.line((105, y + 34, 122, y + 52), fill="#245B48", width=6)
                  d.line((122, y + 52, 145, y + 17), fill="#245B48", width=6)
                  d.text((180, y), f"{i}.", font=label_font, fill="#52677A")
                  yy = y - 4
                  for ln in lines:
                      d.text((250, yy), ln, font=leg_font, fill="#203C57", stroke_width=0)
                      yy += 54
                  y += max(116, 58 * len(lines) + 52)
              # underline and boxed odds, like a pen annotation
              box_y = min(max(y + 14, 1000), 1110)
              d.line((190, box_y, 950, box_y - 3), fill="#203C57", width=4)
              d.text((205, box_y + 14), "COMBINED ODDS", font=label_font, fill="#52677A")
              d.text((205, box_y + 62), combined, font=odds_font, fill="#203C57")
              d.line((190, box_y + 160, 950, box_y + 157), fill="#203C57", width=5)
              d.text((205, 1235), "Check the live price and exact market line before placing", font=tiny_font, fill="#697A84")
              canvas.save(f"slip-{n}.png", quality=95)
              print(f"Generated handwritten-paper Slip {n}: {len(legs)} selections, odds {combined}")
          PY

      - name: Send slip photos to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[report-only]') && !contains(github.event.head_commit.message, '[script-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            file="slip-${n}.png"
            test -s "$file" || { echo "Missing image $file"; exit 1; }
            response=$(curl --fail --silent --show-error --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              --form "chat_id=${TELEGRAM_CHAT_ID}" --form "photo=@${file}" \
              --form "caption=Mr2Odds — Slip ${n}")
            echo "$response" | grep -q '"ok":true' || { echo "Telegram did not confirm Slip ${n} photo"; echo "$response"; exit 1; }
            echo "Telegram confirmed Slip ${n} photo"
          done

      - name: Prepare plain-text YouTube script
        if: ${{ !contains(github.event.head_commit.message, '[report-only]') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          scripts=sorted(Path("reports").glob("youtube-script-*.md"))
          if not scripts:
              raise SystemExit("No YouTube Markdown script found")
          source=scripts[-1]
          text=source.read_text(encoding="utf-8")
          text=re.sub(r"^#{1,6}\s*", "", text, flags=re.M)
          text=re.sub(r"^\[([A-Z0-9 —-]+)\]$", r"\1", text, flags=re.M)
          text=re.sub(r"\*\*(.*?)\*\*", r"\1", text)
          text=re.sub(r"`([^\`]+)`", r"\1", text)
          target=source.with_suffix(".txt")
          target.write_text(text, encoding="utf-8")
          print(f"Prepared {target} ({len(text)} characters)")
          PY

      - name: Send plain-text YouTube script to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[report-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          script=$(ls reports/youtube-script-*.txt | sort | tail -n 1)
          test -s "$script"
          response=$(curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${script}" \
            --form "caption=Mr2Odds — YouTube script (plain text)")
          echo "$response" | grep -q '"ok":true' || { echo "Telegram did not confirm plain-text YouTube script"; echo "$response"; exit 1; }
          echo "Telegram confirmed plain-text YouTube script"

      - name: Send report text to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[script-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -s reports/morning-report.md
          python - <<'PY'
          from pathlib import Path
          text=Path("reports/morning-report.md").read_text(encoding="utf-8").strip()
          if not text: raise SystemExit("Report is empty")
          if len(text)>4000: raise SystemExit(f"Report too long ({len(text)} chars); split before sending.")
          print("Report prepared:",len(text),"characters")
          PY
          response=$(curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@reports/morning-report.md")
          echo "$response" | grep -q '"ok":true' || { echo "Telegram did not confirm report"; echo "$response"; exit 1; }
          echo "Telegram confirmed report text"
