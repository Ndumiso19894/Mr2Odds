name: Telegram morning report delivery

on:
  push:
    branches: [main]
    paths:
      - 'reports/morning-report.md'
      - 'reports/youtube-script-*.md'
      - 'reports/youtube-script-*.txt'
      - '.github/workflows/telegram-morning-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout report
        uses: actions/checkout@v4

      - name: Generate slip images from report
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageDraw, ImageFont
          report = Path("reports/morning-report.md").read_text(encoding="utf-8")
          W,H=1080,1350
          bg,navy,ink,muted,white,blue="#F4F6FA","#101C38","#17233B","#68758B","#FFFFFF","#315DCE"
          fonts="/usr/share/fonts/truetype/dejavu"
          title=ImageFont.truetype(f"{fonts}/DejaVuSans-Bold.ttf",46)
          header=ImageFont.truetype(f"{fonts}/DejaVuSans-Bold.ttf",34)
          body=ImageFont.truetype(f"{fonts}/DejaVuSans.ttf",31)
          small=ImageFont.truetype(f"{fonts}/DejaVuSans.ttf",24)
          bold=ImageFont.truetype(f"{fonts}/DejaVuSans-Bold.ttf",30)
          slips={}
          for sec in re.split(r"(?=SLIP [1-3] —)",report):
            m=re.match(r"SLIP ([1-3]) — (.+)",sec)
            if not m: continue
            num,label=m.groups()
            odds=re.search(r"combined odds\s+([0-9.]+)",sec,re.I)
            risk=re.search(r"Risk:\s*(.+)",sec)
            legs=re.findall(r"^•\s*(.+)$",sec,re.M)
            if not legs: raise SystemExit(f"No selections found for Slip {num}")
            slips[num]=(label.strip(),odds.group(1) if odds else "N/A",legs,risk.group(1).strip() if risk else "")
          if len(slips)!=3: raise SystemExit(f"Expected 3 slips but parsed {len(slips)}")
          for n in "123":
            label,combined,legs,risk=slips[n]
            im=Image.new("RGB",(W,H),bg);d=ImageDraw.Draw(im)
            d.rounded_rectangle((44,40,W-44,230),radius=36,fill=navy)
            d.text((80,72),"Mr2Odds",font=title,fill=white)
            d.text((80,142),f"DAILY SELECTIONS • SLIP {n}",font=small,fill="#C7D5F4")
            d.text((64,280),label.upper(),font=header,fill=ink)
            d.text((64,342),"Selections",font=small,fill=muted)
            y=400
            for i,leg in enumerate(legs,1):
              lines=[];line=""
              for word in leg.split():
                candidate=(line+" "+word).strip()
                if d.textlength(candidate,font=body)>860 and line: lines.append(line);line=word
                else: line=candidate
              if line:lines.append(line)
              ch=110+42*len(lines)
              d.rounded_rectangle((55,y,W-55,y+ch),radius=24,fill=white,outline="#E0E6F0",width=2)
              d.text((82,y+28),f"{i:02d}",font=bold,fill=blue)
              yy=y+26
              for ln in lines:d.text((150,yy),ln,font=body,fill=ink);yy+=42
              y+=ch+22
            y=min(y+12,1010)
            d.rounded_rectangle((55,y,W-55,y+170),radius=30,fill=navy)
            d.text((85,y+26),"COMBINED ODDS",font=small,fill="#C7D5F4")
            d.text((85,y+68),combined,font=title,fill=white)
            y+=196
            if risk:
              rlines=[];line=""
              for word in risk.split():
                candidate=(line+" "+word).strip()
                if d.textlength(candidate,font=small)>900 and line:rlines.append(line);line=word
                else:line=candidate
              if line:rlines.append(line)
              d.text((65,y),"RISK NOTE",font=small,fill=muted)
              for j,ln in enumerate(rlines[:3]):d.text((65,y+38+j*34),ln,font=small,fill=ink)
            d.text((65,H-85),"Verify prices and fixtures before betting • No guarantees",font=small,fill=muted)
            im.save(f"slip-{n}.png")
            print(f"Generated Slip {n}: {len(legs)} selections, odds {combined}")
          PY

      - name: Send slip photos to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[report-only]') && !contains(github.event.head_commit.message, '[script-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            file="slip-${n}.png"
            test -s "$file" || { echo "Missing image $file"; exit 1; }
            response=$(curl --fail --silent --show-error --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              --form "chat_id=${TELEGRAM_CHAT_ID}" --form "photo=@${file}" \
              --form "caption=Mr2Odds — Slip ${n}")
            echo "$response" | grep -q '"ok":true' || { echo "Telegram did not confirm Slip ${n} photo"; echo "$response"; exit 1; }
            echo "Telegram confirmed Slip ${n} photo"
          done

      - name: Prepare plain-text YouTube script
        if: ${{ !contains(github.event.head_commit.message, '[report-only]') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          scripts=sorted(Path("reports").glob("youtube-script-*.md"))
          if not scripts:
              raise SystemExit("No YouTube Markdown script found")
          source=scripts[-1]
          text=source.read_text(encoding="utf-8")
          text=re.sub(r"^#{1,6}\s*", "", text, flags=re.M)
          text=re.sub(r"^\[([A-Z0-9 —-]+)\]$", r"\1", text, flags=re.M)
          text=re.sub(r"\*\*(.*?)\*\*", r"\1", text)
          text=re.sub(r"`([^\`]+)`", r"\1", text)
          target=source.with_suffix(".txt")
          target.write_text(text, encoding="utf-8")
          print(f"Prepared {target} ({len(text)} characters)")
          PY

      - name: Send plain-text YouTube script to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[report-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          script=$(ls reports/youtube-script-*.txt | sort | tail -n 1)
          test -s "$script"
          response=$(curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${script}" \
            --form "caption=Mr2Odds — YouTube script (plain text)")
          echo "$response" | grep -q '"ok":true' || { echo "Telegram did not confirm plain-text YouTube script"; echo "$response"; exit 1; }
          echo "Telegram confirmed plain-text YouTube script"

      - name: Send report text to Telegram
        if: ${{ !contains(github.event.head_commit.message, '[script-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -s reports/morning-report.md
          python - <<'PY'
          from pathlib import Path
          text=Path("reports/morning-report.md").read_text(encoding="utf-8").strip()
          if not text: raise SystemExit("Report is empty")
          if len(text)>4000: raise SystemExit(f"Report too long ({len(text)} chars); split before sending.")
          print("Report prepared:",len(text),"characters")
          PY
          response=$(curl --fail --silent --show-error --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@reports/morning-report.md")
          echo "$response" | grep -q '"ok":true' || { echo "Telegram did not confirm report"; echo "$response"; exit 1; }
          echo "Telegram confirmed report text"
