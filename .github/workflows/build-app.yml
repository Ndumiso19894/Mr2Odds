name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:
    inputs:
      telegram_artifact_run_id:
        description: Optional Actions run ID with a PlayReport-apk artifact to send without rebuilding.
        required: false
        type: string

permissions:
  actions: read
  contents: write

env:
  # One version for the GitHub release and its Telegram attachment.
  APP_VERSION_NAME: 1.8.${{ github.run_number }}

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  apk:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.telegram_artifact_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Version line: 1.6.x belonged to the retired repo, 1.7.x was the first Mr2Odds line,
      # 1.8.x integrates the full legacy app feature set (rebrand to Mr 2 Odds, offline cache,
      # live scores, tickets, advisor). (no arithmetic in env expressions - GitHub's env parser
      # does not accept '+')
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          # Keep releases working if the Actions cache service is unavailable.
          cache-disabled: true

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASSWORD" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASSWORD" ]; then
            echo "Required Android release signing material is missing; refusing to produce a debug-signed release."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          test -s "$RUNNER_TEMP/keystore.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle --no-daemon testDebugUnitTest assembleRelease
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PlayReport.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayReport-apk
          path: ${{ runner.temp }}/PlayReport.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${APP_VERSION_NAME}"
          # release notes = android/RELEASE_NOTES.md (shown inside the app before and after updating)
          { cat android/RELEASE_NOTES.md; printf '\n\nMr 2 Odds for Android v%s (build %s). Download PlayReport.apk and install it. Installed apps update themselves automatically.\n' "$APP_VERSION_NAME" "$APP_VERSION_CODE"; } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$RUNNER_TEMP/PlayReport.apk" --repo "$GITHUB_REPOSITORY" --title "Mr 2 Odds v${APP_VERSION_NAME}" --notes-file "$RUNNER_TEMP/notes.md" --latest

  telegram:
    if: >-
      ${{ always() && ((github.ref == 'refs/heads/main' && needs.apk.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.telegram_artifact_run_id != '')) }}
    name: Send APK to Telegram
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: PlayReport-apk
          path: release-apk
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.telegram_artifact_run_id || github.run_id }}
      - name: Set version for existing artifact
        if: inputs.telegram_artifact_run_id != ''
        env:
          SOURCE_RUN_ID: ${{ inputs.telegram_artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_RUN_NUMBER="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          if [[ ! "$SOURCE_RUN_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Could not determine the source APK run number." >&2
            exit 1
          fi
          echo "APP_VERSION_NAME=1.8.${SOURCE_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Send release to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/send_release_telegram.py release-apk/PlayReport.apk "$APP_VERSION_NAME"
