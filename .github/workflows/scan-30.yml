name: PlayReport scan (every 30 min)

on:
  schedule:
    # GitHub cron is UTC. A run every half hour; the ones nearest 05:00 / 10:00 / 15:00 UTC
    # (07:00 / 12:00 / 17:00 SAST) are the full-report runs, the others refresh prices / results and alert new bets.
    # Note 2026-11-03: the schedule never fired after the account migration (0 schedule runs,
    # idle-slot tests at 12:00 and 12:30 UTC missed even after re-registering the workflow) —
    # the cadence is therefore kept alive by the self-dispatch chain in the `gate` job below.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # optionally force a fresh scan even inside the cadence window
    inputs:
      force_scan:
        description: "Run a full scan now instead of waiting for the normal cadence"
        type: boolean
        default: false

permissions:
  contents: write           # push the state branch
  actions: write            # the chain: the gate dispatches the next run

concurrency:
  group: goals-scan
  cancel-in-progress: false

jobs:
  gate:
    # [CADENCE CHAIN — 2026-11-03]
    # This repo's schedule cron has never fired since the account migration, so the gate job
    # keeps a self-dispatch chain alive:
    #   gate (~30 s) -> dispatches the next run immediately -> the next run's scan job only
    #   executes when NO run of this workflow started in the last 25 minutes; otherwise the
    #   run is a cheap heartbeat (gate only, ~30 s). Effect: a real scan ~every 30 minutes,
    #   indefinitely, without relying on the broken scheduler.
    # Stopping the chain: rename this file or disable the workflow in the Actions tab.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: scan-chain-gate
      cancel-in-progress: true
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Cadence check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SCAN: ${{ inputs.force_scan }}
        run: |
          python3 - "${GITHUB_OUTPUT}" <<'EOF'
          import datetime, json, os, sys, time, urllib.request
          out = sys.argv[1]
          if os.environ.get("FORCE_SCAN", "").lower() == "true":
              print("Manual override: running a fresh scan")
              with open(out, "a") as f:
                  f.write("skip=false\n")
              sys.exit(0)
          token, repo = os.environ["GH_TOKEN"], os.environ["GITHUB_REPOSITORY"]
          # The last REAL scan is when data/app/meta.json was generated (SAST = UTC+2).
          # (The heartbeat runs of this workflow are not scans and must not reset the clock.)
          age = None
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/contents/data/app/meta.json?ref=data" % repo,
                  headers={"Authorization": "token " + token, "Accept": "application/vnd.github+json"})
              meta = json.load(urllib.request.urlopen(req))
              import base64
              doc = json.loads(base64.b64decode(meta["content"]))
              gen = doc.get("generated") or ""
              if gen:
                  ts = datetime.datetime.strptime(gen, "%Y-%m-%d %H:%M")
                  ts = ts.replace(tzinfo=datetime.timezone(datetime.timedelta(hours=2)))
                  age = datetime.datetime.now(datetime.timezone.utc).timestamp() - ts.timestamp()
                  print("last real scan (meta.json generated): %s SAST -> %.0fs ago" % (gen, age))
              else:
                  print("meta.json has no generated field")
          except Exception as e:  # noqa: BLE001 — fail safe: run a real scan
              print("could not read last-scan time (%s) — running a real scan" % e)
          if age is None:
              with open(out, "a") as f:
                  f.write("skip=false\n")
          elif age < 1500:
              # Heartbeat pacing: sleep in 5-min steps instead of spinning a fresh ~10 s run
              # every ~10 s until the next real scan is due. Fewer runs, same 25-min cadence.
              z = min(300.0, 1500.0 - age)
              print("heartbeat: sleeping %.0fs before dispatching the next run" % z)
              time.sleep(z)
              with open(out, "a") as f:
                  f.write("skip=true\n")
          else:
              with open(out, "a") as f:
                  f.write("skip=false\n")
          EOF

      - name: Dispatch next scan (chain)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" -d '{"ref":"main"}' \
            "https://api.github.com/repos/Ndumiso19894/Mr2Odds/actions/workflows/scan-30.yml/dispatches")
          echo "next run dispatch -> HTTP $code"
          [ "$code" = "204" ] || { echo "CHAIN BROKEN: dispatch refused (HTTP $code)"; exit 1; }

  scan:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the 60-day coverage window analyses ~17k fixtures per run; extra headroom for cold starts (no cached state)
    env:
      TIMEZONE: "Africa/Johannesburg"   # timezone for all displayed times and the scan window
      TZ_LABEL: "SAST"
      RUN_HOURS: "7,12,17"  # full-report hours (local); the other half-hourly runs are refreshes
      COVER_DAYS: "60"      # discover + analyse fixtures up to 60 days out (early data collection)
      RECENT_FORM_ENABLED: ${{ vars.RECENT_FORM_ENABLED || '1' }}  # set repository variable to 0 for baseline rollback
      APP_WINDOW_HOURS: "24"  # the app publication still carries today's matches only
      NEWS_HOURS: "72"      # per-fixture news fetches only within 72 h of kick-off
      MIN_P_O15: "0.84"     # shortlist thresholds (final probability)
      MIN_P_O25: "0.60"
      MIN_P_BTTS: "0.60"
      MAX_PICKS: "15"
      SPORTY_CC: "za"       # Sportybet country site used for prices (za, ng, gh, ke, ug, tz, zm)
      WORLD: "1"            # every competition on Livescore.com (v4)
      # Optional manually supplied, rights-cleared pilot snapshots. These are data, never credentials.
      LINEUP_PILOT_INPUT: ${{ vars.LINEUP_PILOT_INPUT }}
      LINEUP_PILOT_RIGHTS_CONFIRMED: ${{ vars.LINEUP_PILOT_RIGHTS_CONFIRMED }}
      STATE_DIR: ${{ github.workspace }}/state
      STATE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # optional
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # wheels only + retries: a PyPI hiccup once made pip fall back to building pandas from source and the run failed
        run: |
          for i in 1 2 3; do
            pip install --only-binary=:all: --retries 10 --timeout 60 -r requirements.txt && break
            echo "pip attempt $i failed, retrying"; sleep 20
          done
          python -c "import pandas, numpy, requests, reportlab; print(pandas.__version__, numpy.__version__)"

      - name: Restore state (data branch)
        run: |
          set -e
          if git clone -q --depth 1 --branch data --single-branch "$STATE_URL" state; then
            echo "state branch restored: $(du -sh state | cut -f1)"
          else
            # Only bootstrap when the data branch really does not exist. A network/auth error
            # must never be mistaken for an empty repository and then force-pushed over history.
            rc=0
            git ls-remote --exit-code --heads "$STATE_URL" data >/dev/null || rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "State clone failed; refusing to bootstrap over existing or unreachable data." >&2
              exit 1
            fi
            echo "data branch does not exist - bootstrapping"
            mkdir -p state
            cp -r data state/ 2>/dev/null || true
            cp -r reports state/reports 2>/dev/null || true
            rm -rf state/reports/pdf
            git -C state init -q -b data
          fi
          printf 'reports/pdf/\n__pycache__/\n' > state/.gitignore

      - name: Run scanner
        run: python scanner.py

      - name: Publish state
        run: |
          set -e
          cd state
          git config user.name "playreport-bot"
          git config user.email "playreport-bot@users.noreply.github.com"
          git add -A
          expected=""
          if git rev-parse -q --verify HEAD >/dev/null 2>&1; then
            expected=$(git rev-parse HEAD)
            if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
            git commit -q --amend -m "State $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            git commit -q -m "State $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          # Retrying transient transport failures is safe: the lease still forbids overwriting
          # another writer's newer data branch, even when a retry is attempted.
          pushed=false
          for delay in 0 5 15; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if git push -q --force-with-lease="refs/heads/data:$expected" "$STATE_URL" HEAD:data; then
              pushed=true
              break
            fi
            echo "State push failed; retrying only if the data branch has not changed." >&2
          done
          if [ "$pushed" != true ]; then
            echo "State publication failed; the previous data remains live." >&2
            exit 1
          fi
          echo "published $(git rev-parse --short HEAD)"

      - name: Trigger Facebook posting window after a fresh scan
        # GitHub schedules can be delayed. Slot-specific claims make fallback dispatches safe.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(TZ=Africa/Johannesburg date +%H)" in
            07|08) gh workflow run facebook-daily.yml --repo "$GITHUB_REPOSITORY" --ref main ;;
            *) echo "Outside a Facebook posting window." ;;
          esac

  unit-tests:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (leagues + world archive)
        # pytest is a test-time tool for this job only; it is deliberately not added to requirements.txt
        run: |
          pip install --only-binary=:all: --retries 10 --timeout 60 -q -r requirements.txt
          pip install --only-binary=:all: --retries 10 --timeout 60 -q pytest
          python -m pytest leagues/tests tests -q

      - name: App regression tests
        run: |
          node tests/test_home_ui.js
          node tests/test_final_picks_ui.js
          node tests/test_daily_accumulator_ui.js
          node tests/test_competition_ui.js
          node tests/test_tickets_ui.js
          node tests/test_pending_refresh_ui.js
          node tests/test_price_floor_ui.js
          node tests/test_sheet_ui.js
          node tests/test_recent_form_ui.js
          node tests/test_h2h_gate_ui.js
          node tests/test_lineup_pilot_ui.js
          node tests/test_market_settlement_ui.js
