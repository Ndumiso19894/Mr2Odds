name: Facebook daily selections

on:
  # UTC = SAST minus two hours: selection cards at 07, 12, 17 and results at 08.
  schedule:
    - cron: '0 5,6,10,15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize triggers so two runs cannot claim the same slot or reuse a fixture.
concurrency:
  group: facebook-daily-selections
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --only-binary=:all: -r requirements.txt 'Pillow>=10,<12' 'imageio-ffmpeg>=0.6,<1'
      - name: Check Page token without posting
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_post.py diagnose
      - name: Check prior post records without posting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from scripts.facebook_history import load_claims
          from scripts.facebook_post import SAST
          claims = load_claims(datetime.now(SAST).date().isoformat(), confirmed_only=True)
          print(f'Found {len(claims)} confirmed selection-card records for today.')
          PY
      - name: Check optional reel music without posting
        env:
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          if not os.environ.get('REEL_MUSIC_FILE_ID'):
              raise SystemExit('Reel music is not configured; set the REEL_MUSIC_FILE_ID repository secret.')
          from scripts.selection_reel import download_music
          with tempfile.TemporaryDirectory() as d:
              download_music(Path(d) / 'music.mp3')
          print('Supplied reel music is accessible and verified.')
          PY
      - name: Check out data for a private reel dry run
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Render a reel without publishing
        env:
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: |
          python scripts/selection_reel.py prepare --snapshot live-data/data/app/latest.json --output "$RUNNER_TEMP/reel-dry-run"
          if [ -s "$RUNNER_TEMP/reel-dry-run/selection-reel.mp4" ]; then
            echo '::notice::Reel dry run rendered successfully; nothing was published.'
          else
            echo '::notice::Reel dry run skipped because too few eligible matches have verified crests.'
          fi
      - name: Check 1X2 selections without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: python scripts/facebook_one_x_two.py prepare --snapshot live-data/data/app/latest.json --output "$RUNNER_TEMP/one-x-two-dry-run"
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Select current South African posting window
        id: day
        run: |
          set -euo pipefail
          day=$(TZ=Africa/Johannesburg date +%F)
          yesterday=$(TZ=Africa/Johannesburg date -d yesterday +%F)
          slot=$(TZ=Africa/Johannesburg date +%H)
          case "$slot" in
            07|12|17) claim="facebook-post-$day-$slot" ;;
            08) claim="facebook-results-$day" ;;
            *) slot=none; claim=none ;;
          esac
          echo "date=$day" >> "$GITHUB_OUTPUT"
          echo "yesterday=$yesterday" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "claim=$claim" >> "$GITHUB_OUTPUT"
          echo "Current posting window: $slot SAST"
      - name: Check whether this slot was already claimed
        id: claim
        if: steps.day.outputs.slot != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_NAME: ${{ steps.day.outputs.claim }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$CLAIM_NAME" --jq ".artifacts[] | select(.name == \"$CLAIM_NAME\" and .expired == false) | .id")
          if [ -n "$ids" ]; then
            echo "This slot was already attempted; check the Page before manual recovery."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Facebook secrets are configured
        if: steps.claim.outputs.available == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ] || ! [[ "$FACEBOOK_PAGE_ID" =~ ^[0-9]+$ ]]; then
            echo "Configure FACEBOOK_PAGE_ACCESS_TOKEN and numeric FACEBOOK_PAGE_ID in Actions secrets." >&2
            exit 1
          fi
      - name: Check out latest published football data
        if: steps.claim.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Set up Python
        if: steps.claim.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and policy dependencies
        if: steps.claim.outputs.available == 'true'
        run: |
          pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt 'Pillow>=10,<12'
      - name: Verify Page access before claiming a post
        if: steps.claim.outputs.available == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_post.py diagnose
      - name: Prepare different eligible selections with real crests
        if: steps.claim.outputs.available == 'true' && steps.day.outputs.slot != '08'
        id: prepare-picks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/facebook_post.py prepare --exclude-claimed --snapshot live-data/data/app/latest.json --output facebook-output/selections.png
      - name: Prepare two images of yesterday's recorded results
        if: steps.claim.outputs.available == 'true' && steps.day.outputs.slot == '08'
        id: prepare-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/facebook_results.py prepare --day-file "live-data/data/app/days/${{ steps.day.outputs.yesterday }}.json" --badges live-data/data/app/badges.json --output facebook-output
      # Claim before the first external write: even ambiguous Facebook outcomes are never retried automatically.
      - name: Record the slot posting claim
        if: steps.prepare-picks.outputs.ready == 'true' || steps.prepare-results.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.day.outputs.claim }}
          path: facebook-output/
          retention-days: 35
          if-no-files-found: error
      - name: Publish photo and caption to Facebook
        if: steps.prepare-picks.outputs.ready == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_post.py publish --image facebook-output/selections.png
      - name: Publish the two-image results post to Facebook
        if: steps.prepare-results.outputs.ready == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_results.py publish --output facebook-output
