name: Facebook daily selections

on:
  # 07:00 South African time. The scan workflow also dispatches this after each
  # successful scan as a fallback if GitHub's scheduled event is delayed.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      retry_today:
        description: 'Publish one additional corrected card for today (only when explicitly requested)'
        type: boolean
        default: false
      redesign_today:
        description: 'Publish the separately authorized white redesign once today'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize all triggers. A persisted daily claim prevents reposts across runs.
concurrency:
  group: facebook-daily-selections
  cancel-in-progress: false

jobs:
  # Dispatching this existing workflow on a feature branch runs a read-only Page
  # identity check, never a post. Production posts run from main only.
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --only-binary=:all: -r requirements.txt 'Pillow>=10,<12'
      - name: Check Page token without posting
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_post.py diagnose
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Compute South African date and claim
        id: day
        env:
          RETRY_TODAY: ${{ inputs.retry_today }}
          REDESIGN_TODAY: ${{ inputs.redesign_today }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          day=$(TZ=Africa/Johannesburg date +%F)
          claim="facebook-post-$day"
          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$RETRY_TODAY" = 'true' ] && [ "$REDESIGN_TODAY" = 'true' ]; then
            echo 'Select only one corrected-post option.' >&2
            exit 1
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$REDESIGN_TODAY" = 'true' ]; then
            claim="$claim-redesign"
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$RETRY_TODAY" = 'true' ]; then
            claim="$claim-retry"
          fi
          echo "date=$day" >> "$GITHUB_OUTPUT"
          echo "claim=$claim" >> "$GITHUB_OUTPUT"
      - name: Check whether today's post was already claimed
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          CLAIM_NAME: ${{ steps.day.outputs.claim }}
        run: |
          set -euo pipefail
          if [[ "$CLAIM_NAME" == *-retry || "$CLAIM_NAME" == *-redesign ]]; then
            original=${CLAIM_NAME%-retry}
            original=${original%-redesign}
            prior=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$original" --jq ".artifacts[] | select(.name == \"$original\" and .expired == false) | .id")
            if [ -z "$prior" ]; then
              echo "A corrected retry requires an existing claim for today's original post." >&2
              exit 1
            fi
          fi
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$CLAIM_NAME" --jq ".artifacts[] | select(.name == \"$CLAIM_NAME\" and .expired == false) | .id")
          if [ -n "$ids" ]; then
            echo "A post was already attempted today; check the Page before any manual recovery."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Facebook secrets are configured
        if: steps.claim.outputs.available == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ] || ! [[ "$FACEBOOK_PAGE_ID" =~ ^[0-9]+$ ]]; then
            echo "Configure FACEBOOK_PAGE_ACCESS_TOKEN and numeric FACEBOOK_PAGE_ID in Actions secrets." >&2
            exit 1
          fi
      - name: Check out latest published football data
        if: steps.claim.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Set up Python
        if: steps.claim.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and policy dependencies
        if: steps.claim.outputs.available == 'true'
        run: |
          pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt 'Pillow>=10,<12'
      - name: Verify Page access before claiming a post
        if: steps.claim.outputs.available == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_post.py diagnose
      - name: Prepare photo with eligible selections and real crests
        if: steps.claim.outputs.available == 'true'
        id: prepare
        run: python scripts/facebook_post.py prepare --snapshot live-data/data/app/latest.json --output facebook-output/selections.png
      # Claim before the external API call: if Facebook times out after accepting a photo,
      # no later run is allowed to risk an accidental duplicate.
      - name: Record the daily posting claim
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.day.outputs.claim }}
          path: facebook-output/
          retention-days: 35
          if-no-files-found: error
      - name: Publish photo and caption to Facebook
        if: steps.prepare.outputs.ready == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python scripts/facebook_post.py publish --image facebook-output/selections.png
