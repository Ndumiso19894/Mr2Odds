name: Telegram video generator

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Runner check
        run: echo "Telegram video workflow runner is working."
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python version
        run: python --version
