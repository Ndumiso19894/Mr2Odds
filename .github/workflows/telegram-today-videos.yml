name: Telegram video generator

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout scan data
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video dependencies
        run: pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt 'Pillow>=10,<12' 'imageio-ffmpeg>=0.6,<1'
      - name: Validate Python scripts
        run: python -m py_compile scripts/facebook_accumulators.py scripts/selection_reel.py scripts/stats_watch_assets.py
