name: Telegram video generator

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Runner check
        run: echo "runner active"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout scan data
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
