name: Telegram video generator

on:
  push:
    branches:
      - data
    paths:
      - 'data/app/latest.json'
      - 'data/app/meta.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Checkout scan data
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video dependencies
        run: |
          pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt
          pip install --only-binary=:all: 'imageio-ffmpeg>=0.6,<1'
      - name: Generate video
        env:
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: python scripts/facebook_accumulators.py prepare --snapshot live-data/data/app/latest.json --output video-output
      - name: Validate video and selection assets
        run: python scripts/facebook_accumulators.py validate --output video-output
      - name: Send video to Telegram only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/selection_reel.py telegram --output video-output
