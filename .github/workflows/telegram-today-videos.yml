name: Telegram today's videos (one-off)

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  schedule:
    - cron: '15,30,45 15-23 * * *'
    - cron: '0 16-23 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram-today-videos
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out today's data branch
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Check today and freshness
        id: fresh
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          now = datetime.now(ZoneInfo('Africa/Johannesburg'))
          if now.date().isoformat() != '2026-11-24':
              print('::notice::One-off delivery window has ended; no video sent.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready=false\\n')
              raise SystemExit(0)
          path=Path('live-data/data/app/latest.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          generated=datetime.strptime(data['meta']['generated'],'%Y-%m-%d %H:%M').replace(tzinfo=ZoneInfo('Africa/Johannesburg'))
          age=now-generated
          if age < timedelta(minutes=-5) or age > timedelta(minutes=90):
              print(f'::notice::Snapshot is stale ({age}); waiting for fresh data. No video sent.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready=false\\n')
              raise SystemExit(0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready=true\\n')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check for an existing Telegram delivery claim
        id: claimcheck
        if: steps.fresh.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=2026-11-24
          name="telegram-today-video-$day"
          count=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$name" --jq ".artifacts[] | select(.name == \"$name\" and .expired == false) | .id" | wc -l)
          if [ "$count" -gt 1 ]; then echo 'Duplicate claims; refusing to send.' >&2; exit 1; fi
          echo "exists=$([ "$count" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install video dependencies
        if: steps.fresh.outputs.ready == 'true' && steps.claimcheck.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        if: steps.fresh.outputs.ready == 'true' && steps.claimcheck.outputs.exists != 'true'
        run: pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt 'Pillow>=10,<12' 'imageio-ffmpeg>=0.6,<1'
      - name: Prepare today's verified video
        id: prepare
        if: steps.fresh.outputs.ready == 'true' && steps.claimcheck.outputs.exists != 'true'
        env:
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: python scripts/facebook_accumulators.py prepare --snapshot live-data/data/app/latest.json --output video-output
      - name: Validate video and manifest
        if: steps.prepare.outputs.ready == 'true'
        run: python scripts/facebook_accumulators.py validate --output video-output
      - name: Check Telegram settings
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || { echo 'Telegram secrets missing.' >&2; exit 1; }
      - name: Create one-time delivery claim
        if: steps.prepare.outputs.ready == 'true'
        run: |
          mkdir -p telegram-claim
          sha256sum video-output/selection-reel.mp4 | cut -d' ' -f1 > telegram-claim/sha256.txt
      - name: Claim Telegram delivery for today
        id: telegram-claim
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-today-video-2026-11-24
          path: telegram-claim/
          retention-days: 35
          if-no-files-found: error
      - name: Send video to Telegram only
        if: steps.telegram-claim.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/selection_reel.py telegram --output video-output
      - name: Store generated video for troubleshooting
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-today-video-preview-2026-11-24
          path: video-output/
          retention-days: 3
          if-no-files-found: error
