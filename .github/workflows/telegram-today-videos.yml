name: Telegram today's videos (one-off)

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 15-21 * * *'

permissions:
  contents: read

concurrency:
  group: telegram-today-videos
  cancel-in-progress: false

jobs:
  test-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm GitHub runner starts
        run: |
          echo "Runner started."
          echo "Current time (UTC): $(date -u)"
          echo "Branch: $GITHUB_REF"
      - uses: actions/checkout@v4
      - name: Verify repository scripts exist
        run: |
          test -f scripts/facebook_accumulators.py
          test -f scripts/selection_reel.py
          echo "Video scripts are present."
