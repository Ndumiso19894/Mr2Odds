name: Telegram today's videos (one-off)

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 15-21 * * *'

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out current scan data
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt 'Pillow>=10,<12' 'imageio-ffmpeg>=0.6,<1'
      - name: Generate video from latest scan
        id: prepare
        env:
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: python scripts/facebook_accumulators.py prepare --snapshot live-data/data/app/latest.json --output video-output
      - name: Validate selections and video
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        run: python scripts/facebook_accumulators.py validate --output video-output
      - name: Send video to Telegram only
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/selection_reel.py telegram --output video-output
      - name: Save generated video artifact
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: telegram-video-preview-2026-11-24
          path: video-output/
          retention-days: 2
          if-no-files-found: error
