name: Telegram today's videos (one-off)

on:
  push:
    paths:
      - '.github/workflows/telegram-today-videos.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 15-21 * * *'

permissions:
  contents: read

concurrency:
  group: telegram-today-videos
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latest football data
        uses: actions/checkout@v4
        with:
          ref: data
          path: live-data
      - name: Validate date and snapshot freshness
        id: fresh
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          tz=ZoneInfo('Africa/Johannesburg')
          now=datetime.now(tz)
          if now.date().isoformat() != '2026-11-24':
              print('::notice::This is a one-day delivery workflow. No video sent.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready=false\\n')
              raise SystemExit(0)
          data=json.loads(Path('live-data/data/app/latest.json').read_text(encoding='utf-8'))
          generated=datetime.strptime(data['meta']['generated'],'%Y-%m-%d %H:%M').replace(tzinfo=tz)
          age=now-generated
          if age < timedelta(minutes=-5) or age > timedelta(minutes=90):
              print(f'::notice::Snapshot is not fresh enough ({age}). Waiting for data refresh.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready=false\\n')
              raise SystemExit(0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('ready=true\\n')
          PY
      - name: Install Python
        if: steps.fresh.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.fresh.outputs.ready == 'true'
        run: pip install --only-binary=:all: --retries 5 --timeout 60 -r requirements.txt 'Pillow>=10,<12' 'imageio-ffmpeg>=0.6,<1'
      - name: Generate today's video
        id: prepare
        if: steps.fresh.outputs.ready == 'true'
        env:
          REEL_MUSIC_FILE_ID: ${{ secrets.REEL_MUSIC_FILE_ID }}
        run: python scripts/facebook_accumulators.py prepare --snapshot live-data/data/app/latest.json --output video-output
      - name: Validate the generated video
        if: steps.prepare.outputs.ready == 'true'
        run: python scripts/facebook_accumulators.py validate --output video-output
      - name: Confirm Telegram configuration
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID"
      - name: Send to Telegram only
        if: steps.prepare.outputs.ready == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/selection_reel.py telegram --output video-output
      - name: Save generated video as temporary artifact
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-video-preview-2026-11-24
          path: video-output/
          retention-days: 2
          if-no-files-found: error
